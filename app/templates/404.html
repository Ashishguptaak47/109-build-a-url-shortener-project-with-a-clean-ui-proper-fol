{% extends "base.html" %}

{% block title %}Link Not Found - SnipURL{% endblock %}

{% block content %}
<div class="min-h-[50vh] flex flex-col items-center justify-center text-center space-y-4">
    <span class="p-3 rounded-full bg-slate-800 text-slate-400 border border-slate-700">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
    </span>
    <h1 class="text-3xl font-bold text-white">Link Inactive or Not Found</h1>
    <p class="text-slate-400 text-sm max-w-md">
        The shortened link you are trying to visit does not exist, has expired, or may have been typed incorrectly.
    </p>
    <a href="/" class="mt-2 px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-semibold transition text-white">
        Return to Home
    </a>
</div>
{% endblock %}
