<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SnipURL - Modern Fast URL Shortener{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="h-full flex flex-col text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white">
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-2 text-xl font-bold tracking-tight text-white hover:opacity-90">
                <span class="p-1.5 rounded-lg bg-indigo-600 text-white">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>
                </span>
                <span>Snip<span class="text-indigo-400">URL</span></span>
            </a>
            <nav class="flex items-center space-x-4 text-sm font-medium text-slate-400">
                <a href="/" class="hover:text-white transition">Home</a>
                <a href="/docs" target="_blank" class="hover:text-white transition">API Docs</a>
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        Built with FastAPI &bull; SQLite &bull; Open Source
    </footer>
</body>
</html>
